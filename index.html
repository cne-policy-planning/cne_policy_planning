<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>교무행정 통합검색</title>
<style>
  :root { font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; color: #1d2939; background: #f5f7fa; }
  body { margin: 0; display: grid; place-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
  .card { background: #fff; border: 1px solid #e1e6ed; border-radius: 14px; padding: 28px; max-width: 520px; line-height: 1.7; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #677489; margin: 0; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>📚 교무행정 통합검색</h1>
    <p>사용자 검색 화면을 준비하고 있습니다. (개발 2단계: 학교급 선택 → 통합검색 → 미리보기 · 내려받기)</p>
  </div>
</body>
</html>
